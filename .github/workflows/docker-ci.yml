name: Docker CI Pipeline

# 1. Триггер: запускать пайплайн при каждом пуше в ветку main
on: 
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: [ self-hosted, Linux, X64 ] # 2. Запускаем на чистой виртуальной машине Ubuntu

    steps:
    # 3. Скачиваем наш код из GitHub в виртуальную машину
    - name: Checkout repository code
      uses: actions/checkout@v4

    # 4. Проверяем, собирается ли наш Docker-образ без ошибок
    - name: Build Docker Image
      run: |
        docker build -t topo-site-test:latest .

    # 5. Тестируем: запускаем контейнер из собранного образа
    - name: Test Docker Container
      run: |
    # 5. Тестируем: запускаем контейнер из собранного образа
    - name: Test Docker Container
      run: |
        docker rm -f test_site || true
        docker run -d --name test_site -p 8085:80 topo-site-test:latest
        sleep 3
        curl --fail http://localhost:8085 || exit 1
        docker rm -f test_site
    # 5.5 Отладка: смотрим, где находится робот и какие файлы он видит
    - name: Debug paths and files
      run: |
        pwd
        ls -la
    # 6. Финальный деплой: запускаем проект через Docker Compose на нашем сервере
    - name: Deploy with Docker Compose
      run: |
        cd ${{ github.workspace }}
        docker compose down --remove-orphans
        docker compose up -d --force-recreate

