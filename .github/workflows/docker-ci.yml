name: Docker CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    # Запускаем сборку и тесты в изолированном облаке GitHub
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Build Docker Image
      run: |
        docker build -t topo-site-test:latest .

    - name: Test Docker Container
      run: |
        docker run -d --name test_site -p 8085:80 topo-site-test:latest
        sleep 3
        curl --fail http://localhost:8085 || exit 1

  deploy:
    # Этот шаг начнется ТОЛЬКО если тесты выше прошли успешно
    needs: build-and-test
    runs-on: ubuntu-latest
    
    steps:
    - name: Deploy to Home Server via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          cd ~/devops_practice
          git pull origin main
          docker compose down --remove-orphans
          docker compose up -d --force-recreate

